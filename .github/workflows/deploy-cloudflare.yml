# ============================================================================
# miliconfig v3.1 - بیلد همیشگی + دپلوی اختیاری روی Cloudflare Pages و Workers
# ----------------------------------------------------------------------------
# این ورک‌فلو «بدون سکرت» هم سبز می‌ماند:
#   ۱. جاب build همیشه اجرا می‌شود: بیلد + مبهم‌سازی + تزریق کد مرده + تست‌ها
#      و بسته آماده استقرار دستی (Pages.zip) را به‌عنوان artifact آپلود می‌کند.
#   ۲. جاب deploy فقط اگر Secretهای کلودفلر در مخزن تنظیم شده باشند اجرا می‌شود؛
#      در غیر این صورت با پیام راهنما رد (skip) می‌شود، نه شکست قرمز.
#
# مسیرهای استقرار بدون هیچ سکرت (پیشنهادی):
#   • Pages  : پنل کلودفلر → Workers & Pages → Create → Pages → Connect to Git
#              Build command: npm run build     Output directory: dist
#   • Workers: پنل کلودفلر → Workers & Pages → Create → Workers → Import a repository
#              Deploy command: npx wrangler deploy
#   • دستی   : فایل _worker.js (یا Pages.zip این ورک‌فلو) را در پنل آپلود کنید.
#
# مسیر اختیاری با سکرت (دپلوی از داخل گیت‌هاب):
#   Settings → Secrets and variables → Actions:
#     ۱) Secret  CLOUDFLARE_API_TOKEN  (دسترسی Cloudflare Pages/Workers: Edit)
#     ۲) Secret  CLOUDFLARE_ACCOUNT_ID
#   اختیاری: Variable به نام CF_PAGES_PROJECT برای تعیین نام پروژه Pages.
# ============================================================================

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    # ورک‌فلوی obfuscate.yml باندل مبهم‌سازی‌شده را خودش کامیت می‌کند؛
    # آن کامیت‌ها دپلوی تکراری نسازند (خود دپلوی، باندل را از سورس می‌سازد).
    paths-ignore:
      - '_worker.js'
      - 'public/_worker.js'
      - 'dist/_worker.js'
      - 'dist/worker.readable.js'
      - '明文源吗'
      - '少年你相信光吗'
      - '**.md'
  workflow_dispatch:
    inputs:
      project_name:
        description: 'نام پروژه Cloudflare Pages (خالی = تشخیص خودکار)'
        required: false
        default: ''
      deploy_worker:
        description: 'دپلوی Worker هم انجام شود؟ (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: cloudflare-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # ۱) بیلد همیشگی (بدون نیاز به هیچ سکرتی)
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.creds.outputs.has_credentials }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-save acorn javascript-obfuscator terser

      - name: Build, obfuscate & inject dead code
        run: npm run build

      - name: Run verification test suite
        run: npm test

      - name: Package manual (secret-free) deploy bundles
        run: |
          mkdir -p deploy/pages
          cp -f _worker.js deploy/pages/_worker.js
          cp -f schema.sql deploy/pages/schema.sql 2>/dev/null || true
          cp -f wrangler.toml deploy/pages/wrangler.toml 2>/dev/null || true
          (cd deploy/pages && zip -r ../Pages.zip . >/dev/null)
          cp -f dist/_worker.js deploy/_worker.js
          ls -la deploy deploy/pages

      - name: Upload deployable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miliconfig-cloudflare-bundles
          path: |
            deploy/Pages.zip
            deploy/_worker.js
            dist/build-info.json
          if-no-files-found: error

      - name: Detect Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ سکرت‌های کلودفلر یافت شد؛ دپلوی خودکار اجرا می‌شود."
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::notice::بدون سکرت اجرا شد: بیلد و تست کامل انجام شد و بسته آماده استقرار (Pages.zip) آپلود شد."
            echo "::notice::برای دپلوی خودکار از گیت‌هاب، Secretهای CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID را تنظیم کنید؛ یا از اتصال Git پنل کلودفلر/آپلود دستی استفاده کنید (بدون سکرت)."
          fi

  # --------------------------------------------------------------------------
  # ۲) دپلوی اختیاری (فقط وقتی سکرت‌ها موجود باشند)
  # --------------------------------------------------------------------------
  deploy:
    needs: build
    if: needs.build.outputs.has_credentials == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build & deploy tooling
        run: npm install --no-save acorn javascript-obfuscator terser wrangler

      - name: Build & obfuscate bundles
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ github.event.inputs.project_name || vars.CF_PAGES_PROJECT }}"
          if [ -z "$PROJECT" ]; then
            DOMAIN=$(npx wrangler pages project list 2>/dev/null | grep -oE '[a-z0-9][a-z0-9-]*\.pages\.dev' | head -1)
            PROJECT="${DOMAIN%.pages.dev}"
            echo "🔎 نام پروژه Pages به‌صورت خودکار تشخیص داده شد: ${PROJECT:-یافت نشد}"
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::نام پروژه Cloudflare Pages پیدا نشد؛ Variable به نام CF_PAGES_PROJECT را با نام پروژه تنظیم کنید."
            exit 1
          fi
          echo "☁️ در حال دپلوی پروژه Pages: $PROJECT"
          set +e
          OUT=$(npx wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$STATUS" -ne 0 ]; then
            if printf '%s' "$OUT" | grep -q 'has been blocked'; then
              echo "::error::پروژه Pages «$PROJECT» توسط کلودفلر مسدود (blocked) شده است؛ تا رفع مسدودی هیچ دپلویی روی آن ممکن نیست. پیگیری: abusereply@cloudflare.com"
            else
              echo "::error::دپلوی Cloudflare Pages ناموفق بود (exit $STATUS)."
            fi
            exit "$STATUS"
          fi
          DEPLOY_URL=$(printf '%s' "$OUT" | grep -oE "https://[a-z0-9]+\.${PROJECT}\.pages\.dev" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://${PROJECT}.pages.dev"
          fi
          echo "🔗 آدرس دپلوی تازه: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # بررسی خروجی واقعیِ دپلوی‌شده: دکمه/لینک کانال پشتیبانی باید t.me/miliconfig باشد.
      - name: Verify support channel link on the deployed site
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          ADMIN_UUID=$(grep -oE "DEFAULT_ADMIN_UUID = '[^']+'" src/config/defaults.js | head -1 | cut -d"'" -f2)
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -s -m 25 "$URL/$ADMIN_UUID/" || true)
            if printf '%s' "$BODY" | grep -q 't\.me/miliconfig'; then
              echo "✅ لینک کانال پشتیبانی روی نسخه دپلوی‌شده درست است ($URL)."
              exit 0
            fi
            echo "… تلاش $i: هنوز در دسترس/به‌روز نیست، ۱۰ ثانیه صبر…"
            sleep 10
          done
          echo "::error::لینک کانال پشتیبانی (t.me/miliconfig) روی نسخه دپلوی‌شده پیدا نشد."
          exit 1

      - name: Deploy Worker (optional)
        if: ${{ github.event.inputs.deploy_worker == 'yes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
